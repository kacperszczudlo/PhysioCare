name: Backend tests

on:
  push:
    paths:
      - 'backend/**'
      - 'scripts/run_tests.py'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/run_tests.py'
      - '.github/workflows/backend-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: physiocare_test
          POSTGRES_USER: physiocare
          POSTGRES_PASSWORD: physiocare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U physiocare -d physiocare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: 'true'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: physiocare_test
      POSTGRES_USER: physiocare
      POSTGRES_PASSWORD: physiocare
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_TEST_DB: physiocare_test_pytest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest
        working-directory: backend
        run: |
          python -m pytest tests \
            --cov=physiocare \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/reports/coverage.xml
            backend/reports/junit.xml
          if-no-files-found: ignore
