<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}PhysioCare{% endblock %}</title>
    <!--[if mso]>
    <style type="text/css">
      table, td { font-family: Arial, sans-serif !important; }
    </style>
    <![endif]-->
  </head>
  <body style="margin: 0; padding: 0; background-color: #f9faf5; font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; color: #1c1f13;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f9faf5; padding: 40px 16px;">
      <tr>
        <td align="center">
          <!-- Main Container -->
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 560px; background-color: #ffffff; border-radius: 16px; border: 1px solid #e2e7d3; overflow: hidden; box-shadow: 0 4px 16px rgba(28, 31, 19, 0.05);">
            <!-- Header Bar -->
            <tr>
              <td style="background-color: #505816; padding: 24px 32px; text-align: left;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                  <tr>
                    <td style="vertical-align: middle;">
                      <img src="cid:physiocare_logo" alt="PhysioCare" style="height: 32px; width: auto; vertical-align: middle; margin-right: 10px; border: 0; display: inline-block;" />
                      <span style="font-size: 22px; font-weight: 700; color: #ffffff; letter-spacing: -0.4px; vertical-align: middle; display: inline-block;">PhysioCare</span>
                      <div style="font-size: 12px; color: #e4ebb8; margin-top: 4px; font-weight: 400; letter-spacing: 0.2px;">System Opieki Fizjoterapeutycznej</div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Content Area -->
            <tr>
              <td style="padding: 36px 32px 28px 32px;">
                <h2 style="font-size: 19px; font-weight: 700; color: #1c1f13; margin: 0 0 16px 0; line-height: 1.4;">
                  {% block greeting %}Cześć,{% endblock %}
                </h2>

                {% block content %}
                {% endblock %}
              </td>
            </tr>

            <!-- Footer Area -->
            <tr>
              <td style="padding: 0 32px 32px 32px;">
                <hr style="border: 0; border-top: 1px solid #edf0e4; margin: 8px 0 24px 0;" />
                <div style="font-size: 12px; color: #767d64; text-align: center; line-height: 1.6;">
                  To jest wiadomość wygenerowana automatycznie przez system <strong>PhysioCare</strong>.<br />
                  Prosimy na nią nie odpowiadać.<br /><br />
                  &copy; {% now "Y" %} PhysioCare. Wszystkie prawa zastrzeżone.
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
