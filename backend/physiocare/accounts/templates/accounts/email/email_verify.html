<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>PhysioCare - potwierdź e-mail</title>
  </head>
  <body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #1a1a1a;">
    <p>{% if first_name %}Cześć {{ first_name }},{% else %}Cześć,{% endif %}</p>
    <p>Twój kod weryfikacyjny PhysioCare:</p>
    <p style="font-size: 28px; letter-spacing: 0.25em; font-weight: 700;">{{ code }}</p>
    <p>Kod jest ważny przez {{ validity_minutes }} minut. Wpisz go w aplikacji, aby aktywować konto.</p>
    <p style="color: #666;">Jeśli to nie Ty zakładałeś konto, zignoruj tę wiadomość.</p>
    <p>PhysioCare</p>
  </body>
</html>
